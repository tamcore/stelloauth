replicaCount: 1

image:
  repository: ghcr.io/tamcore/stelloauth
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # The /oauth endpoint streams progress over Server-Sent Events and a single
  # login can take 60-120s. These nginx-ingress defaults stop the proxy from
  # buffering the stream (which freezes progress) or cutting it at the default
  # 60s timeout. Override for other ingress controllers.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: stelloauth.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute — alternative to Ingress for clusters running nginx-gateway-fabric
# or another Gateway API implementation.
httpRoute:
  enabled: false
  # Inject an nginx-gateway-fabric SnippetsFilter so the /oauth SSE stream is not
  # buffered or cut (NGF buffers responses and defaults to a 60s proxy timeout,
  # which freezes progress and breaks logins longer than ~60s). Requires NGF
  # started with `--snippets`. Set to false if your gateway handles this already.
  sse: true
  sseTimeout: "300s"
  parentRefs: []
  #  - name: nginx-gateway
  #    namespace: nginx-gateway
  hostnames: []
  #  - stelloauth.example.com
  # Optional list of additional filters to inject into the HTTPRoute rule.
  # Useful for implementation-specific features, e.g. an NGF SnippetsFilter
  # for IP allowlisting or an ExtAuth filter for external authentication.
  filters: []
  #  - type: ExtensionRef
  #    extensionRef:
  #      group: gateway.nginx.org
  #      kind: SnippetsFilter
  #      name: stelloauth-ip-allowlist

resources: {}

rateLimit:
  enabled: false
  count: 3
  duration: "24h"

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env: {}

# CloakBrowser stealth-Chromium sidecar (drives the OAuth login, clears reCAPTCHA).
cloakbrowser:
  enabled: true
  image:
    repository: cloakhq/cloakbrowser
    tag: "0.5.2"
    pullPolicy: IfNotPresent
  # CloakBrowser's cloakserve binds this port inside the pod. localhost-only;
  # not exposed on the Service.
  port: 9222
  resources: {}

# Concurrency guard. CloakBrowser's free tier allows one session; raise
# maxSessions only with a CloakBrowser Pro license.
cloak:
  maxSessions: 1
  queueTimeout: "60s"
