replicaCount: 1

image:
  repository: ghcr.io/tamcore/stelloauth
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

monitoring:
  address: "0.0.0.0"
  port: 9090
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: "30s"
    scrapeTimeout: "10s"
  prometheusRule:
    enabled: false
    additionalLabels: {}
    failureRatio:
      threshold: 0.5
      window: "15m"
      minimumAttempts: 4
      for: "10m"
      severity: warning

ingress:
  enabled: false
  className: ""
  # The /oauth endpoint streams progress over Server-Sent Events and a single
  # login can take 60-120s. These nginx-ingress defaults stop the proxy from
  # buffering the stream (which freezes progress) or cutting it at the default
  # 60s timeout. Override for other ingress controllers.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: stelloauth.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute — alternative to Ingress for clusters running nginx-gateway-fabric
# or another Gateway API implementation.
httpRoute:
  enabled: false
  # Inject an nginx-gateway-fabric SnippetsFilter so the /oauth SSE stream is not
  # buffered or cut (NGF buffers responses and defaults to a 60s proxy timeout,
  # which freezes progress and breaks logins longer than ~60s). Requires NGF
  # started with `--snippets`. Set to false if your gateway handles this already.
  sse: true
  sseTimeout: "300s"
  parentRefs: []
  #  - name: nginx-gateway
  #    namespace: nginx-gateway
  hostnames: []
  #  - stelloauth.example.com
  # Optional list of additional filters to inject into the HTTPRoute rule.
  # Useful for implementation-specific features, e.g. an NGF SnippetsFilter
  # for IP allowlisting or an ExtAuth filter for external authentication.
  filters: []
  #  - type: ExtensionRef
  #    extensionRef:
  #      group: gateway.nginx.org
  #      kind: SnippetsFilter
  #      name: stelloauth-ip-allowlist

resources: {}

rateLimit:
  enabled: false
  count: 3
  duration: "24h"

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env: {}

# CloakBrowser stealth-Chromium sidecar (drives the OAuth login, clears reCAPTCHA).
cloakbrowser:
  enabled: true
  image:
    repository: cloakhq/cloakbrowser
    tag: "0.5.2"
    pullPolicy: IfNotPresent
  # CloakBrowser's cloakserve binds this port inside the pod. localhost-only;
  # not exposed on the Service.
  port: 9222
  resources: {}
  # cloakserve binds 127.0.0.1:9222 only, so httpGet probes (which use the pod IP)
  # never reach it. Probe with exec+curl against localhost inside the container.
  # cloakserve can wedge (unresponsive) while the container stays "running",
  # silently breaking logins; the liveness probe restarts it, the startup probe
  # covers boot, and readiness reflects health.
  startupProbe:
    exec:
      command: ["curl", "-sf", "--max-time", "5", "http://localhost:9222/json/version"]
    periodSeconds: 5
    failureThreshold: 60 # up to ~5 min to bind (first start downloads Chrome)
    timeoutSeconds: 6
  livenessProbe:
    exec:
      command: ["curl", "-sf", "--max-time", "5", "http://localhost:9222/json/version"]
    periodSeconds: 15
    timeoutSeconds: 6
    failureThreshold: 3
  readinessProbe:
    exec:
      command: ["curl", "-sf", "--max-time", "5", "http://localhost:9222/json/version"]
    periodSeconds: 10
    timeoutSeconds: 6
    failureThreshold: 3

# Concurrency guard. CloakBrowser's free tier allows one session; raise
# maxSessions only with a CloakBrowser Pro license.
cloak:
  maxSessions: 1
  queueTimeout: "60s"

# Optional IP-based country pre-selection. Set to a GeoLite2-Country .mmdb path
# or URL (e.g. https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz)
# to enable; empty disables it.
geoip:
  countryDB: ""
