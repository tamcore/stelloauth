{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "stelloauth.fullname" . }}
  labels:
    {{- include "stelloauth.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "stelloauth.fullname" . }}
          port: {{ .Values.service.port }}
      {{- $filters := .Values.httpRoute.filters | default list }}
      {{- if .Values.httpRoute.sse }}
      {{- $sseFilter := dict "type" "ExtensionRef" "extensionRef" (dict "group" "gateway.nginx.org" "kind" "SnippetsFilter" "name" (printf "%s-sse" (include "stelloauth.fullname" .))) }}
      {{- $filters = prepend $filters $sseFilter }}
      {{- end }}
      {{- if $filters }}
      filters:
        {{- toYaml $filters | nindent 8 }}
      {{- end }}
{{- end }}
